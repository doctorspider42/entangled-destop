<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Entangled Desktop</title>
  <desc id="desc">Run Linux in a window. A Rust VMM built on native hypervisors. Linked white and ice-blue rings on a Deep Field background.</desc>
  <defs>
    <radialGradient id="field" cx="78%" cy="38%" r="75%"><stop stop-color="#172b3a"/><stop offset=".6" stop-color="#0d141e"/><stop offset="1" stop-color="#0a0d12"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8cc8e0" stroke-opacity=".045"/></pattern>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4edf6"/><stop offset="1" stop-color="#5aa9cc"/></linearGradient>
  </defs>
  <rect width="1280" height="520" rx="20" fill="url(#field)"/>
  <rect width="1280" height="520" rx="20" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1279" height="519" rx="20" fill="none" stroke="#2c3645"/>
  <g fill="#8cc8e0"><circle cx="741" cy="81" r="1.5"/><circle cx="1197" cy="103" r="2"/><circle cx="1126" cy="399" r="1.5"/><circle cx="722" cy="361" r="1"/><circle cx="583" cy="67" r="1"/><circle cx="1230" cy="320" r="1"/></g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <path d="M66 67h26" stroke="#8cc8e0" stroke-width="3"/>
    <text x="106" y="73" fill="#8cc8e0" font-size="13" font-weight="600" letter-spacing="3">A DESKTOP VMM, BUILT IN RUST</text>
    <text x="62" y="181" fill="#e4e8ee" font-size="78" font-weight="700" letter-spacing="-4">Entangled</text>
    <text x="62" y="265" fill="#e4e8ee" font-size="78" font-weight="700" letter-spacing="-4">Desktop<tspan fill="#8cc8e0">.</tspan></text>
    <text x="66" y="321" fill="#b1becd" font-size="25">Run Linux in a window.</text>
    <text x="66" y="358" fill="#b1becd" font-size="25">Your hypervisor. Our machine.</text>
    <path d="M66 415H610" stroke="#2c3645"/>
    <text x="66" y="454" fill="#98a2b3" font-size="15" letter-spacing="1">LINUX / KVM</text>
    <text x="235" y="454" fill="#98a2b3" font-size="15" letter-spacing="1">WINDOWS / WHP</text>
    <text x="449" y="454" fill="#8cc8e0" font-size="15" letter-spacing="1">macOS / HVF</text>
  </g>
  <g fill="none" stroke="#8cc8e0" stroke-opacity=".14"><circle cx="972" cy="246" r="192"/><circle cx="972" cy="246" r="218" stroke-dasharray="2 12"/><path d="M722 246h500M972 22v448" stroke-opacity=".09"/></g>
  <g fill="none" stroke-width="17">
    <circle cx="1010" cy="246" r="105" stroke="url(#ice)"/>
    <circle cx="929" cy="246" r="105" stroke="#e4e8ee"/>
    <path d="M933.83 141.11A105 105 0 0 1 1000.26 168.89" stroke="#111e2a" stroke-width="29"/>
    <path d="M926.48 141.03A105 105 0 0 1 1005.48 174.06" stroke="#e4e8ee" stroke-width="17"/>
    <path d="M1005.17 350.89A105 105 0 0 1 938.74 323.11" stroke="#111e2a" stroke-width="29"/>
    <path d="M1012.52 350.97A105 105 0 0 1 933.52 317.94" stroke="url(#ice)" stroke-width="17"/>
  </g>
  <circle cx="1150" cy="172" r="5" fill="#8cc8e0"/>
  <circle cx="806" cy="342" r="3" fill="#e4e8ee"/>
  <text x="972" y="472" fill="#7d8d9e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" text-anchor="middle" letter-spacing="3">YOUR HYPERVISOR. OUR MACHINE.</text>
</svg>
