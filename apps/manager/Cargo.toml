[package]
name = "entangled-manager"
description = "Native desktop manager for Entangled Desktop virtual machines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "entangled-manager"
path = "src/main.rs"

[dependencies]
egui.workspace = true
eframe.workspace = true
# Present only to align naga's feature set across the two wgpu majors in the
# workspace — see the comment in the root Cargo.toml.
naga.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
png.workspace = true
control-api.workspace = true

# Only for the SIGTERM path of `stop`; every other process operation goes
# through portable `std::process` (see ADR-0002 — this crate builds on Windows).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
