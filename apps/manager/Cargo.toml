[package]
name = "entangled-manager"
description = "Native desktop manager for Entangled Desktop virtual machines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "entangled-manager"
path = "src/main.rs"

[dependencies]
egui.workspace = true
eframe.workspace = true
# Present only to align naga's feature set across the two wgpu majors in the
# workspace — see the comment in the root Cargo.toml.
naga.workspace = true
# eframe's `wgpu` feature pulls wgpu in without any backend (backends only come
# with eframe's `default` feature, which would also drag in glow). Declaring
# wgpu here selects the same backend set `crates/display` uses; not used in code.
# NOTE: version 25 on purpose — that is the major egui-wgpu 0.32 links against.
wgpu = { version = "25", default-features = false, features = [
    "wgsl",
    "vulkan",
    "gles",
    "dx12",
] }
# Native file/folder pickers. Never called on the egui thread — every dialog
# runs on its own worker thread and the answer comes back through the same
# waker/channel pattern the scanner and the metrics sampler use.
rfd.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# Update check against the GitHub Releases API (EPIC 12 follow-up): the same
# rustls-only HTTP client debian-media already ships, same workspace version.
ureq.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
png.workspace = true
control-api.workspace = true
disk-image.workspace = true
# Read-only: `vm_snapshot::inspect` answers what a snapshot is of, how big, from
# which host and whether it could be restored — without a VM, a disk or a byte
# of guest memory (ADR-0006 names this as the manager's way in). It is the one
# exception to "the manager links no VMM code", and it is not one in spirit: no
# hypervisor is ever opened in this process, and running a machine is still a
# child `entangled` process and nothing else.
vm-snapshot.workspace = true

# SIGTERM for `stop`, sysconf/statm for the metrics sampler; every other
# process operation goes through portable `std::process` (see ADR-0002 — this
# crate builds on Windows).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The metrics sampler's four Windows syscalls (process times, working set,
# system times, memory status). Same crate and license the WHP backend uses.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[lints]
workspace = true
