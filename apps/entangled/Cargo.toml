[package]
name = "entangled"
description = "The entangled command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "entangled"
path = "src/main.rs"

[dependencies]
clap.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `engine-install`: the shared download-verify-install of the Linux engine
# for WSL (control-api/src/wsl_engine.rs), which this binary and the other
# one both perform and neither may reimplement.
control-api = { workspace = true, features = ["engine-install"] }
debian-media.workspace = true
disk-image.workspace = true
vmm-core.workspace = true
# The snapshot container (ADR-0006): the format, the fingerprints, the refusals.
vm-snapshot.workspace = true

# The run path (run_vm.rs) is portable across the two hypervisor hosts; these
# are its machine, device and presentation crates, every one of which builds
# natively on Windows too (ADR-0002).
machine-x86.workspace = true
linux-boot.workspace = true
uefi-boot.workspace = true
virtio-core.workspace = true
virtio-block.workspace = true
virtio-net.workspace = true
virtio-sound.workspace = true
virtio-gpu.workspace = true
virtio-input.workspace = true
display.workspace = true

# The installer's two file formats — gzip-concatenated cpio for the d-i preseed,
# TOML for the profile it writes — are pure byte logic and are needed on both
# hosts since `install` stopped being Linux-only (EPIC 17 phase 5).
flate2.workspace = true
toml.workspace = true
# Deserializes the compiled-in guest-artifact pins (bootstrap.rs, firmware.rs) -
# four fields and a list each, but they decide which kernel and which firmware a
# guest boots, so they get a typed shape rather than hand parsing.
serde.workspace = true
# One caller: the GitHub Releases API answer that names a *private* repository's
# release asset by id (artifact.rs). The browser download URL 404s without
# credentials, and the API asset endpoint is the only way in.
serde_json.workspace = true

# `sigaction` for the run path's SIGINT/SIGTERM handler; Windows uses
# `SetConsoleCtrlHandler` below.
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

# Ctrl+C handling for the run path (`SetConsoleCtrlHandler`); same crate and
# license the WHP backend already uses.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Console"] }

# The Fedora Live acceptance test reads back the screenshot it asked for: the
# Live image's own command line has no `console=`, so the scanout is the only
# evidence that a desktop came up at all. Same decoder the display crate
# already uses to write them.
[dev-dependencies]
png.workspace = true

[lints]
workspace = true
