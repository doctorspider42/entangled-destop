# cargo-about configuration for generating THIRD_PARTY_LICENSES (MVP-006).
#
# SCOPE: this reads the Cargo dependency graph, and therefore covers Rust
# crates and nothing else. It cannot see the one non-crate binary we
# redistribute — the EDK2 UEFI firmware (BSD-2-Clause-Patent) that ships inside
# the Windows installer — so that attribution is carried by hand in
# THIRD-PARTY-NOTICES.txt and named in about.hbs, which puts it at the top of
# the generated report. Anything else we ever ship that is not a crate belongs
# in those two files as well; adding a licence id here would not do it.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    # Mozilla CA root store data shipped by `webpki-roots` (see deny.toml).
    "CDLA-Permissive-2.0",
    # The egui/eframe GUI tree (see the scoped exceptions in deny.toml):
    # BSL-1.0 for clipboard-win/error-code (permissive, no reciprocity);
    # OFL-1.1 + Ubuntu-font-1.0 govern egui's bundled FONT DATA only and put
    # no conditions on the program rendering them.
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
