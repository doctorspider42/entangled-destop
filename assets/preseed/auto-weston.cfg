# Entangled Desktop automated installation profile (backlog MVP-1010 + EPIC 13).
#
# Produces a minimal Debian with Weston auto-started on tty1. This is a TEST
# profile: user debian / password debian. Network is preseeded statically on
# the kernel command line by `entangled install --auto` (no DHCP server on the
# host TAP); values here only fill gaps.
#
# The machine boots via the host's bootstrap kernel (direct boot), so the
# bootloader step is skipped entirely — do not add grub back.

# The installer runs on the project's bootstrap kernel (Debian builds
# virtio_mmio without CONFIG_VIRTIO_MMIO_CMDLINE_DEVICES, so the d-i kernel
# can never see cmdline-announced virtio-mmio devices; ours has everything
# built in). Consequences preseeded here:
#  - the d-i initrd carries no modules for our kernel version — fine,
#    everything needed is built in;
#  - the target kernel cannot be derived from the running one.
d-i anna/no_kernel_modules boolean true
d-i base-installer/kernel/image string linux-image-amd64

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string entangled
d-i netcfg/get_domain string local

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i passwd/root-login boolean false
d-i passwd/user-fullname string Entangled Test User
d-i passwd/username string debian
d-i passwd/user-password password debian
d-i passwd/user-password-again password debian
d-i user-setup/allow-password-weak boolean true

d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean false

# Whole-disk regular partitioning on the virtio disk: single ext4 root
# (first primary partition — the host's post-install detection reads the
# first 0x83 MBR entry) plus swap from the atomic recipe.
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

d-i base-installer/install-recommends boolean false
d-i apt-setup/security_host string security.debian.org
d-i apt-setup/non-free-firmware boolean true

# Configure no additional apt services (no security, no updates suite).
#
# Not a preference — a requirement for an *unattended* install. `apt-setup`
# selects the security suite by default, scans `security.debian.org`, and when
# that scan is not satisfied it raises a **critical-priority note** ("Cannot
# access repository / Commented out entries for security.debian.org have been
# added…") with a <Continue> button. `priority=critical` does not skip a note,
# nothing else in this file can answer it, and the Debian path has no serial
# automation script to press Enter — so the installer simply stops there
# forever. Measured on a Windows host with the user-mode NAT, after the base
# system (hundreds of packages from deb.debian.org through the same NAT) had
# installed cleanly, so it is the scan of *this* host that is not satisfied and
# not the network as a whole.
#
# An empty selection means the scan never happens. A throwaway test VM does
# not need the security suite; a real machine adds it after first boot, where a
# failure is a message rather than a wedged installer.
d-i apt-setup/services-select multiselect

tasksel tasksel/first multiselect
d-i pkgsel/include string weston libgl1-mesa-dri seatd dbus sudo libpam-systemd
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# No bootloader: the host boots the system directly (EPIC 11).
d-i grub-installer/skip boolean true
d-i nobootloader/confirmation_common note

# EPIC 13: autologin on tty1 and auto-start Weston for the test user.
# The payload files ride in the installer initrd (appended by `entangled
# install` next to this preseed) and are only copied here — no shell
# escaping across debconf/sh layers, which is exactly what broke the first
# attempt at this via printf.
d-i preseed/late_command string \
    in-target systemctl enable seatd || true ; \
    in-target usermod -aG video,input,render debian || true ; \
    mkdir -p /target/etc/systemd/system/getty@tty1.service.d ; \
    cp /entangled/autologin.conf /target/etc/systemd/system/getty@tty1.service.d/autologin.conf ; \
    cat /entangled/weston-profile.sh >> /target/home/debian/.profile ; \
    in-target chown debian:debian /home/debian/.profile

d-i finish-install/reboot_in_progress note

# End by powering the machine off, not by rebooting.
#
# `entangled install` learns that an installation finished from the guest
# stopping, and only one of the two endings means that on both hosts: an ACPI S5
# write, which `machine_x86::acpi::pm` latches and both backends report as a
# clean stop. d-i's default reboot ends in the kernel's restart chain, which with
# `reboot=k` is a triple fault: KVM reports that as `KVM_EXIT_SHUTDOWN`, but WHP
# with local APIC emulation *absorbs* the reset and the vCPU parks inside
# `WHvRunVirtualProcessor` with no exit at all — so on Windows the installer VM
# would hang forever after a successful install (see the whp-backend skill's
# trap list, and ADR-0002's phase-4 amendment).
d-i debian-installer/exit/poweroff boolean true
