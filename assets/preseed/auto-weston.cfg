# Entangled Desktop automated installation profile (backlog MVP-1010 + EPIC 13).
#
# Produces a minimal Debian with Weston auto-started on tty1. This is a TEST
# profile: user debian / password debian. Network is preseeded statically on
# the kernel command line by `entangled install --auto` (no DHCP server on the
# host TAP); values here only fill gaps.
#
# The machine boots via the host's bootstrap kernel (direct boot), so the
# bootloader step is skipped entirely — do not add grub back.

# The installer runs on the project's bootstrap kernel (Debian builds
# virtio_mmio without CONFIG_VIRTIO_MMIO_CMDLINE_DEVICES, so the d-i kernel
# can never see cmdline-announced virtio-mmio devices; ours has everything
# built in). Consequences preseeded here:
#  - the d-i initrd carries no modules for our kernel version — fine,
#    everything needed is built in;
#  - the target kernel cannot be derived from the running one.
d-i anna/no_kernel_modules boolean true
d-i base-installer/kernel/image string linux-image-amd64

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string entangled
d-i netcfg/get_domain string local

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i passwd/root-login boolean false
d-i passwd/user-fullname string Entangled Test User
d-i passwd/username string debian
d-i passwd/user-password password debian
d-i passwd/user-password-again password debian
d-i user-setup/allow-password-weak boolean true

d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean false

# Whole-disk regular partitioning on the virtio disk: single ext4 root
# (first primary partition — the host's post-install detection reads the
# first 0x83 MBR entry) plus swap from the atomic recipe.
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

d-i base-installer/install-recommends boolean false
d-i apt-setup/security_host string security.debian.org
d-i apt-setup/non-free-firmware boolean true

tasksel tasksel/first multiselect
d-i pkgsel/include string weston libgl1-mesa-dri seatd dbus sudo
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# No bootloader: the host boots the system directly (EPIC 11).
d-i grub-installer/skip boolean true
d-i nobootloader/confirmation_common note

# EPIC 13: autologin on tty1 and auto-start Weston for the test user.
d-i preseed/late_command string \
    in-target systemctl enable seatd || true; \
    in-target usermod -aG video,input,render debian || true; \
    in-target mkdir -p /etc/systemd/system/getty@tty1.service.d; \
    in-target sh -c "printf '[Service]\nExecStart=\nExecStart=-/sbin/agetty --autologin debian --noclear %%I \\$TERM\n' > /etc/systemd/system/getty@tty1.service.d/autologin.conf"; \
    in-target sh -c "printf 'if [ -z \"\\$WAYLAND_DISPLAY\" ] && [ \"\\$(tty)\" = \"/dev/tty1\" ]; then exec weston; fi\n' >> /home/debian/.profile"

d-i finish-install/reboot_in_progress note
