[package]
name = "control-api"
description = "VM configuration model and lifecycle API for CLI (and later GUI) frontends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# The download-and-install half of the WSL Linux engine (`src/wsl_engine.rs`),
# shared by `entangled wsl install-engine` and the manager's Settings button.
# Behind a feature because it is the only thing in this crate that needs an
# HTTP client, and `disk-image` and `vm-snapshot` — which depend on the config
# model and nothing else — must not grow a TLS and OpenPGP stack to get it.
engine-install = ["dep:debian-media", "dep:tracing"]
# The host monitor's refresh rate (`refresh::host_monitor`), which a new
# machine's `[display] refresh_hz` is derived from: EnumDisplaySettings on
# Windows, the DRM connectors' EDIDs on Linux. Behind a feature for the same
# reason as `engine-install`: `disk-image` and `vm-snapshot` read profiles and
# have no business linking the Windows GDI bindings to do it.
host-display = ["dep:windows"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
# Only with `engine-install`: the digest, the HTTP transport and the provenance
# manifest the whole project already shares. Never a second copy of any of them.
debian-media = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# Only with `host-display`: `EnumDisplaySettingsW`.
windows = { workspace = true, optional = true, features = ["Win32_Graphics_Gdi"] }

[lints]
workspace = true
