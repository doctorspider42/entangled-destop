[package]
name = "machine-arm64"
description = "ARM64 machine: Device Tree, PL011, PSCI and direct Linux boot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
vm-memory.workspace = true
vmm-core.workspace = true
virtio-core.workspace = true
vm-fdt = "0.3"
