[target.'cfg(target_arch = "aarch64")'.dependencies]
linux-loader = { workspace = true, features = ["pe"] }

[lints]
workspace = true

[dev-dependencies]
ext4-view = { version = "0.9.3", features = ["std"] }
virtio-block.workspace = true
virtio-net.workspace = true
virtio-gpu.workspace = true
display.workspace = true
tracing-subscriber.workspace = true
virtio-9p.workspace = true
