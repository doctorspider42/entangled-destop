[package]
name = "vmm-core"
description = "KVM handle, guest memory and VM lifecycle for Entangled Desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
# Portable: the mmap backend is VirtualAlloc-backed on Windows (see the
# workspace manifest and ADR-0002).
vm-memory.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
kvm-ioctls.workspace = true
kvm-bindings.workspace = true
vmm-sys-util.workspace = true
libc.workspace = true

# Windows Hypervisor Platform backend (EPIC 17). `windows` is Microsoft's
# official binding crate, MIT OR Apache-2.0.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Hypervisor",
] }

# The WHP boot test (`tests/whp_boot.rs`) drives the real machine model: MP
# table, ACPI tables, the userspace irqchip, the 16550 and the bzImage loader.
# That is a dependency *cycle* through dev-dependencies — machine-x86 depends on
# vmm-core — which cargo permits precisely because a dev-dependency never enters
# the library's own build graph. The alternative would be a separate test crate
# that exists only to hold one file; the acceptance criterion names
# `cargo test -p vmm-core --test whp_boot`, so the test lives here.
[target.'cfg(windows)'.dev-dependencies]
machine-x86.workspace = true
linux-boot.workspace = true
# `tests/whp_virtio_blk.rs` (WHP-1703) attaches a real virtio-blk device to the
# virtio-mmio window, which is the whole point of the test: the device crates are
# portable, so the acceptance boot uses the same ones the KVM path does.
# `tests/whp_virtio_pci.rs` (phase 4) does the same over the PCI transport, and
# `tests/whp_usernet.rs` attaches the smoltcp user-mode NAT; `tests/whp_uefi.rs`
# boots the CloudHv firmware through `uefi-boot`.
virtio-core.workspace = true
virtio-block.workspace = true
virtio-net.workspace = true
uefi-boot.workspace = true

[lints]
workspace = true
