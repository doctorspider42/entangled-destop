[package]
name = "linux-boot"
description = "Direct bzImage + initramfs boot via the Linux x86 boot protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
machine-x86.workspace = true
# Portable: `linux-loader` parses a bzImage and writes `boot_params` through
# `vm-memory`, with no host syscalls of its own, so the loader works on both
# hosts (ADR-0002).
linux-loader.workspace = true
vm-memory.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
vmm-core.workspace = true

[lints]
workspace = true
