[package]
name = "virtio-gpu"
description = "virtio-gpu device: 2D scanout plus VirGL 3D behind a renderer trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
virtio-core.workspace = true
virtio-queue.workspace = true
vm-memory.workspace = true

# The real 3D renderer (ADR-0004) dlopens libvirglrenderer at runtime; the
# loader itself is the only build-time dependency, and only on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
libloading.workspace = true

# Renderer-crash containment on Windows (VEN-2004): the helper process talks to
# the VMM over a duplex named pipe, which has no `std` equivalent. Microsoft's
# own binding crate, already in this workspace for the WHP backend.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
] }

# `tests/gpu_remote.rs` proves the containment on Windows too, and its
# handle-leak assertion needs the process handle count.
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
virtio-core = { workspace = true, features = ["test-utils"] }
# Dev-only cycle: `display` depends on this crate for the pixel format and
# `Rect`, and the end-to-end tests drive a real `DisplayHandle::detached`
# scanout. Cargo allows cycles through dev-dependencies, and nothing in the
# shipped `virtio-gpu` library links against `display` — the device talks to
# the host through the [`ScanoutSink`] trait.
display.workspace = true
png.workspace = true

[lints]
workspace = true
