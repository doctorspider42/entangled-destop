[package]
name = "virtio-gpu"
description = "virtio-gpu device: 2D scanout plus VirGL 3D behind a renderer trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
virtio-core.workspace = true
virtio-queue.workspace = true
vm-memory.workspace = true

# The real 3D renderer (ADR-0004) dlopens libvirglrenderer at runtime; the
# loader itself is the only build-time dependency, and only on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
libloading.workspace = true

[dev-dependencies]
virtio-core = { workspace = true, features = ["test-utils"] }
# Dev-only cycle: `display` depends on this crate for the pixel format and
# `Rect`, and the end-to-end tests drive a real `DisplayHandle::detached`
# scanout. Cargo allows cycles through dev-dependencies, and nothing in the
# shipped `virtio-gpu` library links against `display` — the device talks to
# the host through the [`ScanoutSink`] trait.
display.workspace = true
png.workspace = true

[lints]
workspace = true
