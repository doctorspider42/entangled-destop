[package]
name = "virtio-net"
description = "virtio-net device with a TAP backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exposes `usernet::offline::OfflineNet`: the router with no host sockets, which
# is what the `usernet_frames` fuzz target drives. Off by default — a VM must
# never be able to build a NAT that does not connect.
fuzzing = []

[dependencies]
thiserror.workspace = true
tracing.workspace = true
virtio-core.workspace = true
# Portable: the device, its RX worker and every frame check build anywhere.
# Only the TAP backend is Linux-only (see the target section below).
virtio-queue.workspace = true
vm-memory.workspace = true
# The user-mode network backend (`usernet`): smoltcp supplies the checked wire
# codecs (Ethernet, ARP, IPv4, UDP, ICMP, DHCP) and the TCP state machine. Both
# hosts use it — it is the only option on Windows and the rootless option on
# Linux.
smoltcp.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
vmm-sys-util.workspace = true

[dev-dependencies]
virtio-core = { workspace = true, features = ["test-utils"] }

[lints]
workspace = true
