[package]
name = "virtio-sound"
description = "virtio-snd device (playback) with ALSA and WASAPI host backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
# Portable: the protocol, the validation, the device and its pump thread build
# and test anywhere. Only the two host sinks are OS-specific (below).
virtio-core.workspace = true
virtio-queue.workspace = true
vm-memory.workspace = true

# ALSA is reached by runtime `dlopen`, never by linking: libasound is LGPL and
# `cargo deny check` blocks copyleft in this binary's graph, so `libloading`
# (ISC, already in the graph) is the whole Linux audio dependency. The full
# reasoning is in `src/alsa.rs`; the precedent is ADR-0004's virglrenderer.
[target.'cfg(target_os = "linux")'.dependencies]
libloading.workspace = true

# WASAPI through Microsoft's own bindings (MIT OR Apache-2.0).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    # IMMDevice::Activate names a PROPVARIANT in its signature, which lives
    # behind these two.
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[dev-dependencies]
virtio-core = { workspace = true, features = ["test-utils"] }

[lints]
workspace = true
