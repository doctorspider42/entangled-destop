# The published virglrenderer `entangled fetch virglrenderer` downloads.
#
# This file is COMPILED INTO the `entangled` binary (apps/entangled/src/virgl_lib.rs,
# `include_str!`). It is the trust anchor for those downloads: bytes that do not
# hash to the `sha256` below are deleted, not used. There is no signature and no
# key — this is as strong as the git history of this repository and no stronger,
# which is why the digests belong here, in review, and not in a checksum file
# fetched from beside the artifact.
#
# WHY THIS ARTIFACT EXISTS
#   Ubuntu jammy packages virglrenderer 0.9.1, which has no Venus and no blob
#   resources at all (ADR-0004). Venus needs >= 1.0 built with `-Dvenus=true`,
#   which no distribution we target ships, so a user who cannot build one from
#   source cannot have Venus — and building from source needs meson, ninja and
#   six -dev packages that a *user* should never be asked for. Hence a published
#   binary, the same bargain as the firmware and the bootstrap kernel.
#
# WHAT A USER STILL NEEDS ON THEIR OWN HOST
#   Only runtime libraries, all of them on any desktop install: libepoxy.so.0,
#   libdrm.so.2, libgbm.so.1, libvulkan.so.1, libm, libc. Note `libvulkan.so.1`
#   in particular — it is a hard `DT_NEEDED` of a Venus-capable build, where the
#   distribution's 0.9.x does not link Vulkan at all. A host without a Vulkan
#   loader therefore cannot load this library, and `virtio_gpu::virgl` falls
#   back to the system one rather than losing 3D altogether.
#
# GLIBC BASELINE
#   Built on ubuntu-22.04, the same runner as the Linux engine in
#   `.github/workflows/release.yml`, so both binaries this project publishes for
#   Linux carry the same floor: GLIBC_2.34. That covers Ubuntu 22.04+, Debian 12+
#   and Fedora 35+, and excludes Ubuntu 20.04 and Debian 11 — which the Linux
#   engine already excluded, so this artifact narrows nothing.
#
# HOW TO UPDATE IT
#   1. Change `guest/virglrenderer/build-virglrenderer.sh` (or its pinned
#      virglrenderer/Vulkan-Headers revisions) and push.
#      `.github/workflows/virglrenderer.yml` builds both files on Linux,
#      publishes them under a new immutable tag, and prints the exact
#      replacement for the block below in its job summary.
#   2. Commit that block. Until you do, `entangled` keeps fetching the previous
#      tag, which still exists — a release tag is never reused.
#
#   The digests below are of the PUBLISHED assets. Never paste the digest of a
#   local build: on 2026-09-10 that mistake in `guest/firmware/pinned.toml` made
#   every fetch die on a mismatch and stopped `release.yml` building an
#   installer at all.
#
# WHAT THIS BLOCK WAS UNTIL 2026-09-26
#   Placeholders (all-zero digests), from 0526b91 until the workflow first ran
#   on 2026-09-25. It published `virglrenderer-1.1.0-1` from the same push as
#   release v0.2.49, and nobody committed the block its summary printed, so
#   v0.2.49 shipped with the zeros: `entangled fetch virglrenderer` downloaded
#   the real library and deleted it on the digest mismatch, for everyone. The
#   fresh-install acceptance found it; `scripts/fresh-install-acceptance.sh` now
#   runs that fetch with an empty cache, the check the firmware pin already had.
#   The digests below are the published assets' (the release's SHA256SUMS).

