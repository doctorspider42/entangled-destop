# The published UEFI firmware `entangled fetch firmware` downloads.
#
# This file is COMPILED INTO the `entangled` binary (apps/entangled/src/firmware.rs,
# `include_str!`). It is the trust anchor for that download: bytes that do not
# hash to the `sha256` below are deleted, not used. There is no signature and no
# key — this is as strong as the git history of this repository and no stronger,
# which is why the digest belongs here, in review, and not in a checksum file
# fetched from beside the artifact.
#
# WHAT THIS IS
#   EDK2's OvmfPkg/CloudHv/CloudHvX64 build — the fw_cfg-free, PVH-entry OVMF
#   variant — with the flash PCDs pointed at 0xFFC00000 so UEFI variables land
#   in a pflash device this VMM can back with a per-VM .nvram file. All of that
#   is guest/firmware/build-cloudhv.sh, and the reasoning is in
#   docs/adr/0003-uefi-firmware.md. The image is exactly 4 MiB and its first
#   four bytes are \x7fELF; anything else is not this firmware.
#
# LICENCE
#   BSD-2-Clause-Patent (EDK2). Permissive: no source obligation, unlike the
#   GPL-2.0 bootstrap kernel next door, which is why this one — and only this
#   one — is also shipped inside the Windows installer. The attribution we owe
#   is in THIRD-PARTY-NOTICES.txt, which the installer both shows on its licence
#   page and lays down beside the binaries.
#
# HOW TO UPDATE IT
#   1. Change `guest/firmware/build-cloudhv.sh` (or bump EDK2_TAG in it) and
#      push. `.github/workflows/firmware.yml` builds it on Linux, publishes it
#      under a new immutable tag with its provenance and licence, and prints the
#      exact replacement for the block below in its job summary.
#   2. Commit that block. Until you do, `entangled` keeps fetching the previous
#      tag, which still exists — a release tag is never reused.
#
# WHY THIS BLOCK WAS WRONG FOR A DAY, AND WHAT IT COSTS TO GET WRONG
#   Until 2026-09-10 the digest here was of a firmware built *locally* on
#   2026-08-19, written while the tag below had no release behind it. The
#   firmware workflow then ran and published a real one — a build of this same
#   script, from the same EDK2 tag, on a runner — and it hashed to something
#   else. (The two CI builds of that evening, 106 seconds apart, are
#   byte-identical to each other, so the build is reproducible on one image;
#   what is not reproducible is a build on somebody's laptop against a
#   different distribution's GCC.) Nothing noticed for a day, because a digest
#   is only checked by a host that has to download:
#     * the developer machine had the local build in its cache already and
#       never fetched;
#     * the Windows installer carries its own copy (installer/entangled.iss),
#       so a fresh Windows install still worked.
#   Everyone else — every Linux user, every WSL engine, every host recovering
#   from a "firmware MISSING" — ran the one command the tool tells them to run
#   and got "does not match the digest pinned in guest/firmware/pinned.toml".
#   The release pipeline stopped too: .github/workflows/release.yml refuses to
#   build an installer around a firmware that misses this pin, so main shipped
#   nothing until the pin was corrected.
#
#   The lesson is in step 1 above: the digest here is of the PUBLISHED asset,
#   which means it can only be written after the workflow has published one. A
#   digest of a local build is a placeholder, and a placeholder that nothing
#   fetches is a placeholder nothing catches.
#
#   scripts/fresh-install-acceptance.{ps1,sh} run `entangled fetch firmware`
#   with an empty cache and no token, which is the check that would have caught
#   this on the day it happened.

