; meson cross file of build-x86.cmd: a 32-bit Windows target on a 64-bit
; Windows machine. The compiler is made 32-bit by CL=-m32 in the script.
[binaries]
c = 'clang-cl'
cpp = 'clang-cl'
ar = 'llvm-lib'

[properties]
needs_exe_wrapper = false

[host_machine]
system = 'windows'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'
