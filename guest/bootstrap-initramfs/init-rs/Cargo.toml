# Standalone project (excluded from the workspace): the bootstrap initramfs
# /init that mounts the installed system's root and switch_roots into it
# (backlog MVP-1103..1106). Built for x86_64-unknown-linux-musl by
# scripts/build-bootstrap-initramfs.sh.

[package]
name = "vmhost-bootstrap-init"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
