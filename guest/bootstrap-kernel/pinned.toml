# The published guest artifacts `entangled fetch bootstrap-kernel` downloads.
#
# This file is COMPILED INTO the `entangled` binary (apps/entangled/src/bootstrap.rs,
# `include_str!`). It is the trust anchor for those downloads: bytes that do not
# hash to the `sha256` below are deleted, not used. There is no signature and no
# key — this is as strong as the git history of this repository and no stronger,
# which is why the digests belong here, in review, and not in a checksum file
# fetched from beside the artifact.
#
# HOW TO UPDATE IT
#   1. Change `guest/bootstrap-kernel/{build.sh,entangled.config}` or
#      `guest/bootstrap-initramfs/`, and push. `.github/workflows/guest-artifacts.yml`
#      builds both artifacts on Linux, publishes them under a new immutable tag
#      together with the corresponding kernel source (GPLv2 §3), and prints the
#      exact replacement for the block below in its job summary.
#   2. Commit that block. Until you do, `entangled` keeps fetching the previous
#      tag, which still exists — a release tag is never reused.
#
# The artifacts themselves are guest-side content and do not go through
# `cargo deny`: `vmlinuz` is GPL-2.0-only Linux, `initrd.img` is this project's
# own `init` (see LICENSE) statically linked against musl (MIT). See `source`
# below for where the kernel's corresponding source is published.

# NOT YET PUBLISHED. The digests below are of a real build of this repository's
# `guest/bootstrap-kernel/build.sh` + `scripts/build-bootstrap-initramfs.sh`
# (Linux 6.12.9, made on 2026-09-09), and the whole fetch/verify/install chain
# was exercised end to end against them; but nobody with push rights has run the
# guest-artifacts workflow yet, so the tag below has no release behind it and a
# fetch answers 404 with a message saying exactly that. Run the workflow, then
# replace this whole block with what it prints and delete this note.
# Until then, ENTANGLED_BOOTSTRAP_DIR (a directory holding vmlinuz and
# initrd.img) is the supported way in.

