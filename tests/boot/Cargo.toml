[package]
name = "boot-tests"
description = "Boot integration tests: repeated-boot endurance and queue-notify benchmarking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Nothing here is shipped; the crate exists so the boot harness can be shared
# between the endurance test (MVP-1403) and the queue-notify benchmark
# (MVP-307) without any production crate dev-depending on all of them.

[target.'cfg(target_os = "linux")'.dependencies]
vmm-core.workspace = true
# For `VirtioTransport`: the harness picks the transport with the same type the
# CLI parses out of a VM profile, so a boot test cannot drift from a real run.
control-api.workspace = true
machine-x86.workspace = true
linux-boot.workspace = true
# For the UEFI+ACPI boot test: the firmware path has no shared harness (it
# boots a firmware, not a kernel), but it belongs with the other real-VM tests.
uefi-boot.workspace = true
virtio-core.workspace = true
virtio-block.workspace = true
# `allocated_bytes` for the discard acceptance: the reclaim measurement uses the
# product's own helper, not a second implementation of it.
disk-image.workspace = true
# The UEFI ISO boot test attaches the whole device set a real run does — five PCI
# functions, five IOAPIC pins — because a reduced one is a different machine.
virtio-gpu.workspace = true
virtio-input.workspace = true
display.workspace = true
tracing.workspace = true

[lints]
workspace = true
