[workspace]
resolver = "2"
exclude = [
    "guest/test-rootfs/init-rs",
    "guest/bootstrap-initramfs/init-rs",
    # cargo-fuzz targets: nightly-only (libfuzzer-sys + -Zsanitizer), own
    # workspace, never part of `cargo test --workspace`. See fuzz/README.md.
    "fuzz",
]
members = [
    "crates/vmm-core",
    "crates/machine-x86",
    "crates/linux-boot",
    "crates/virtio-core",
    "crates/virtio-block",
    "crates/virtio-net",
    "crates/virtio-gpu",
    "crates/virtio-input",
    "crates/display",
    "crates/debian-media",
    "crates/control-api",
    "apps/entangled",
    "apps/manager",
    "tests/boot",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://example.invalid/entangled"
# Internal crates are never published; this also tells `cargo deny` that the
# version-less `{ path = … }` dependencies between them are intentional
# (`bans.allow-wildcard-paths` only applies to unpublished crates).
publish = false

[workspace.dependencies]
# internal crates (version present so `cargo deny` wildcard ban is satisfied)
vmm-core = { path = "crates/vmm-core", version = "0.1.0" }
machine-x86 = { path = "crates/machine-x86", version = "0.1.0" }
linux-boot = { path = "crates/linux-boot", version = "0.1.0" }
virtio-core = { path = "crates/virtio-core", version = "0.1.0" }
virtio-block = { path = "crates/virtio-block", version = "0.1.0" }
virtio-net = { path = "crates/virtio-net", version = "0.1.0" }
virtio-gpu = { path = "crates/virtio-gpu", version = "0.1.0" }
virtio-input = { path = "crates/virtio-input", version = "0.1.0" }
display = { path = "crates/display", version = "0.1.0" }
debian-media = { path = "crates/debian-media", version = "0.1.0" }
control-api = { path = "crates/control-api", version = "0.1.0" }

# rust-vmm (Linux-only, gate behind cfg(target_os = "linux"))
kvm-ioctls = "0.24"
kvm-bindings = "0.14"
# vm-memory is PORTABLE (EPIC 17 / ADR-0002): its `backend-mmap` region type
# is VirtualAlloc-backed on Windows and mmap-backed on unix. The default
# `rawfd` feature is what is unix-only — upstream even has a
# `compile_error!("rawfd feature is not supported on Windows targets!")` — and
# nothing in this workspace uses the fd-based `ReadVolatile`/`WriteVolatile`
# impls it provides, so it stays off everywhere.
vm-memory = { version = "0.17", default-features = false, features = [
    "backend-mmap",
] }
linux-loader = { version = "0.14", features = ["bzimage", "elf"] }
vmm-sys-util = "0.15"
virtio-queue = "0.17"
vm-superio = "0.8"

# general
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
libc = "0.2"

# host display (EPIC 7) — portable, built on Windows and Linux alike.
# wgpu is pinned to 26 because 30 raises the MSRV above workspace rust-version.
winit = { version = "0.30", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
] }
wgpu = { version = "26", default-features = false, features = [
    "std",
    "wgsl",
    "vulkan",
    "gles",
    "dx12",
    "parking_lot",
] }
pollster = "0.4"
png = "0.18"

# Native GUI manager (EPIC 16). egui/eframe are MIT OR Apache-2.0 and ride the
# wgpu backend the workspace already ships. Pinned to the 0.32 series: it is
# the last one whose MSRV (1.85) still matches `workspace.package.rust-version`
# (0.33 needs 1.88, 0.36 needs 1.95).
egui = { version = "0.32", default-features = false }
# Feature-unification fixup, not used in code: eframe 0.32 rides wgpu 25 while
# `display` rides wgpu 26, so naga 25 and naga 26 share one `codespan-reporting`
# 0.12. naga 25 asks for its `termcolor` feature, and naga 26 picks its
# diagnostics writer type by *its own* feature flags — without this line naga 26
# compiles the no-termcolor path against a termcolor-enabled dependency and
# fails. Drop it when both crates agree on one wgpu major.
naga = { version = "26", features = ["termcolor"] }
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "x11",
    "wayland",
] }
=======
# Native Windows host (EPIC 17, ADR-0002). Microsoft's official bindings,
# MIT OR Apache-2.0; only ever referenced from
# `[target.'cfg(windows)'.dependencies]`.
windows = { version = "0.62", default-features = false }

# Installer mode (EPIC 10): gzip for the preseed initrd append.
flate2 = "1"

# Media downloader (EPIC 6). rustls-only HTTP (no OpenSSL linkage) and rpgp for
# OpenPGP — never sequoia-openpgp, which is LGPL (see deny.toml).
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
pgp = { version = "0.17", default-features = false }
rand = "0.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
panic = "abort"
