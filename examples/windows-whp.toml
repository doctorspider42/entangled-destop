# `entangled run`, natively on a Windows host, through the Windows Hypervisor
# Platform (EPIC 17 phase 4):
#
#   cargo run -p entangled -- run examples\windows-whp.toml
#
# The profile shape is exactly the Linux one — same keys, same devices, same
# window. The one Windows-specific choice is the network backend: there is no
# TAP on Windows (and the drivers that would provide one are GPL), so the
# user-mode NAT carries the traffic — DHCP, DNS relay and outbound TCP from
# inside the `entangled` process, no administrator required. `usernet` works on
# Linux too, as the rootless option.
#
# Artifacts: scripts/fetch-test-kernel.sh + scripts/build-test-initramfs.sh (in
# WSL), or copy artifacts/ from a Linux checkout. The test guest prints
# VMHOST_GUEST_READY and reboots; point [boot] at the bootstrap initramfs and
# add a [[disk]] to switch_root into an installed image instead.
name = "whp-bootstrap"
memory_mib = 512
vcpus = 2

[boot]
mode = "direct-linux"
kernel = "artifacts/bootstrap/vmlinuz"
initramfs = "artifacts/tests/test-initramfs.cpio.gz"
# `entangled.poweroff=1`: end the run through ACPI S5, which both hosts turn
# into a clean stop.
#
# `reboot=k` is left on the line but no longer decides anything: since ADR-0005
# a guest reset *reboots the VM in place* rather than ending it, on both hosts —
# the keyboard-controller pulse `reboot=k` selects is a rung of the ladder
# `machine_x86::reset` implements, so it reaches the host even on WHP, where the
# triple fault below it is absorbed by the hypervisor. Without the
# `entangled.poweroff=1` this profile would simply reboot for ever, which is the
# right behaviour for a VM and the wrong one for a smoke test.
cmdline = "console=ttyS0 earlyprintk=serial panic=1 reboot=k entangled.poweroff=1"

[network]
backend = "usernet"
# The backend appends its own `ip=` clause (the address its DHCP server would
# hand out) for direct-Linux guests, so this profile needs nothing to have a
# configured NIC. Adding `ip=dhcp` to the command line above instead makes the
# guest kernel *ask* — a profile's own `ip=` wins over the appended one — which
# is how the DHCP server is exercised by a real client:
#
#   host : granted the guest a DHCP lease mac=… ip=192.168.74.15
#   guest: IP-Config: Got DHCP answer from 192.168.74.1, my address is 192.168.74.15
