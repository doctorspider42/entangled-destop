# Boots a UEFI firmware instead of a kernel (EPIC 18, docs/adr/0003-uefi-firmware.md):
#   bash guest/firmware/build-cloudhv.sh
#   cargo run -p entangled -- run --headless examples/uefi-firmware.toml
#
# CLOUDHV.fd is a PVH ELF, so it is loaded into guest RAM and entered in 32-bit
# protected mode. A flash-image firmware (plain OVMF-style) would instead be
# mapped as a ROM ending at 4 GiB and entered through the reset vector — the
# same profile shape, decided by the image itself.
#
# Phase 2 scope: the firmware talks on ttyS0 and installs the machine's ACPI
# tables (handed over in hvm_start_info.rsdp_paddr). It still cannot boot a
# guest — that needs virtio-pci (see the ADR's gap map), because CloudHv ships
# no virtio-mmio driver at all.
#
# NOTE: `entangled run` does not publish the ACPI tables yet — one call to
# machine_x86::acpi::write next to mptable::write in apps/entangled/src/run_vm.rs
# (see .claude/skills/acpi-machine/SKILL.md). Until that lands, the automated
# path is `cargo test -p boot-tests --test uefi_acpi -- --nocapture`.
name = "uefi-firmware"
memory_mib = 2048
vcpus = 1

[boot]
mode = "uefi"
firmware = "artifacts/firmware/CLOUDHV.fd"
