# Boots a UEFI firmware instead of a kernel (EPIC 18, docs/adr/0003-uefi-firmware.md):
#   bash guest/firmware/build-cloudhv.sh
#   cargo run -p entangled -- run --headless examples/uefi-firmware.toml
#
# CLOUDHV.fd is a PVH ELF, so it is loaded into guest RAM and entered in 32-bit
# protected mode. A flash-image firmware (plain OVMF-style) would instead be
# mapped as a ROM ending at 4 GiB and entered through the reset vector — the
# same profile shape, decided by the image itself.
#
# This profile has **no disks on purpose**: it is the firmware bring-up, and a
# healthy run ends at `BdsDxe: No bootable option or device was found.` — the
# firmware works, installs the machine's ACPI tables (handed over in
# hvm_start_info.rsdp_paddr), and has nothing to boot.
#
# To actually boot something, see examples/ubuntu-uefi.toml: that needs
# `transport = "pci"`, because CloudHv ships no virtio-mmio driver at all, and
# `entangled run` refuses `mode = "uefi"` with disks on any other transport
# rather than letting you watch a healthy firmware find no media.
name = "uefi-firmware"
memory_mib = 2048
vcpus = 1

[boot]
mode = "uefi"
firmware = "artifacts/firmware/CLOUDHV.fd"
