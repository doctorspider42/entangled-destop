name: Release

# Every push to main becomes a GitHub Release carrying the Windows installer.
# The version is MAJOR.MINOR from [workspace.package] in Cargo.toml with the
# workflow run number as PATCH (e.g. 0.2.137) — monotonically increasing, so
# the manager's update check can compare it against the running build.
#
# Two jobs, because the installer carries a Linux-built artifact: `firmware`
# obtains CLOUDHV.fd on ubuntu-latest (see its own comment) and hands it to
# `windows-installer` as a workflow artifact.

on:
  push:
    branches: [main]

permissions:
  contents: write

# One release at a time: overlapping pushes to main queue up instead of racing
# each other's tag creation and asset upload. Runs are not cancelled — every
# push still gets its release, in order.
concurrency:
  group: release-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Pinned Inno Setup 7 (the .iss is written for it). Bump deliberately.
  # Official binaries live on the issrc GitHub releases; files.jrsoftware.org
  # only carries the .issig signatures.
  INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe

jobs:
  # The UEFI firmware the installer ships (installer/entangled.iss).
  #
  # It has to come from somewhere Linux, because EDK2 does not build on
  # windows-latest, and it has to come from *somewhere* on every run, because
  # the .iss has no `skipifsourcedoesntexist` on it: a setup without the
  # firmware installs a program that cannot create an Ubuntu or a Fedora
  # machine, which is the bug this job exists to prevent from recurring.
  #
  # Fast path: download the pinned release asset, which is what
  # guest/firmware/pinned.toml promises every `entangled fetch firmware` will
  # get, and verify it against that same pin — so the copy inside the installer
  # is byte-identical to the copy a source checkout downloads. Slow path: build
  # it (~10 min). The slow path is what makes this job work before the firmware
  # workflow has ever run, and the summary says which path was taken.
  firmware:
    name: The UEFI firmware for the installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the pin
        id: pin
        run: |
          set -euo pipefail
          pin=guest/firmware/pinned.toml
          tag=$(sed -n 's/^tag = "\(.*\)"$/\1/p' "$pin" | head -1)
          sha=$(sed -n 's/^sha256 = "\(.*\)"$/\1/p' "$pin" | head -1)
          [ -n "$tag" ] && [ -n "$sha" ] || { echo "cannot read $pin" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Download the pinned firmware
        id: download
        # `gh release download` uses the workflow token, so it reaches assets of
        # this PRIVATE repository — which a plain releases/download URL cannot.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/firmware
          if gh release download "${{ steps.pin.outputs.tag }}" \
               --pattern 'CLOUDHV.fd*' --dir artifacts/firmware 2>/dev/null \
             && [ -s artifacts/firmware/CLOUDHV.fd ]; then
            got=$(sha256sum artifacts/firmware/CLOUDHV.fd | cut -d' ' -f1)
            if [ "$got" = "${{ steps.pin.outputs.sha }}" ]; then
              echo "source=the pinned release ${{ steps.pin.outputs.tag }}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A tag whose bytes have changed is a broken promise, not a warning:
            # every `entangled fetch firmware` in the field is rejecting them.
            echo "::error::${{ steps.pin.outputs.tag }} serves sha256 $got, but" \
                 "guest/firmware/pinned.toml pins ${{ steps.pin.outputs.sha }}." \
                 "Release tags are immutable by contract; fix the pin or the release."
            exit 1
          fi
          echo "::notice::No published firmware at ${{ steps.pin.outputs.tag }} — building it."
          echo "source=a fresh EDK2 build (nothing published at ${{ steps.pin.outputs.tag }} yet)" \
            >> "$GITHUB_OUTPUT"
          rm -f artifacts/firmware/CLOUDHV.fd
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev iasl nasm python3 git
          bash guest/firmware/build-cloudhv.sh

      - name: Say where it came from
        run: |
          {
            echo "### UEFI firmware in this installer"
            echo
            echo "From **${{ steps.download.outputs.source }}**."
            echo
            echo '```'
            sha256sum artifacts/firmware/CLOUDHV.fd
            cat artifacts/firmware/CLOUDHV.fd.provenance 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: uefi-firmware
          path: artifacts/firmware/
          if-no-files-found: error
          retention-days: 1

  windows-installer:
    name: Windows installer + GitHub Release
    needs: firmware
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Into the same `artifacts/firmware/` a checkout that ran
      # guest/firmware/build-cloudhv.sh would have, which is where the .iss
      # looks by default (`/DFirmwareDir`).
      - uses: actions/download-artifact@v4
        with:
          name: uefi-firmware
          path: artifacts/firmware

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Compute the release version
        id: version
        shell: pwsh
        run: |
          # MAJOR.MINOR come from the workspace version; PATCH is the run
          # number, so every push to main yields a strictly newer release.
          $m = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(\d+)\.(\d+)\.\d+"')[0]
          if (-not $m) { throw "workspace version not found in Cargo.toml" }
          $version = "{0}.{1}.{2}" -f $m.Matches[0].Groups[1].Value,
                                      $m.Matches[0].Groups[2].Value,
                                      "${{ github.run_number }}"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "release version: $version"

      - name: Build release binaries
        env:
          # build.rs stamps this into both binaries: --version output, the
          # manager's window title and its update check all report it.
          ENTANGLED_VERSION: ${{ steps.version.outputs.version }}
        run: cargo build --release -p entangled -p entangled-manager

      - name: Install Inno Setup 7 (pinned)
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup-installer.exe'
          Invoke-WebRequest -Uri $env:INNO_SETUP_URL -OutFile $exe
          Start-Process -Wait -FilePath $exe -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS'
          $iscc = "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }

      - name: Compile the installer
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Inno Setup 7\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DBinDir=$PWD\target\release" `
            installer\entangled.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          # A real release marked latest (not draft, not prerelease): the
          # manager's update check reads /releases/latest.
          gh release create "v$v" `
            --title "Entangled Desktop v$v" `
            --generate-notes `
            --latest `
            "installer/Output/entangled-desktop-$v-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
