name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build-test:
    name: Build, lint and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        # KVM-dependent tests self-skip when /dev/kvm is absent on the runner.
        run: cargo test --workspace

  build-test-windows:
    name: Build, lint and test (Windows, EPIC 17)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        # The whole workspace builds natively on Windows (ADR-0002). The whp_*
        # acceptance tests need the "Windows Hypervisor Platform" optional
        # feature and the guest artifacts, neither of which a GitHub runner has:
        # they self-skip, exactly like the KVM tests without /dev/kvm.
        run: cargo test --workspace
      - name: WHP acceptance tests self-skip cleanly
        # The self-skip path is a contract, not an accident: a broken probe
        # would either fail loudly here or silently stop covering real hosts.
        # This asserts the test *ran*, printed its skip diagnosis, and passed.
        shell: pwsh
        run: |
          $out = cargo test -p vmm-core --test whp_boot -- --nocapture 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "whp_boot failed instead of self-skipping" }
          if ($out -notmatch "skipping:") {
            throw "expected the WHP boot test to report its self-skip on a runner without WHP"
          }

  venus-protocol:
    name: Venus protocol is generated, and matches Mesa's C (EPIC 20)
    # crates/virtio-gpu/src/venus/protocol/ is generated from the vendored
    # venus-protocol generator (tools/venus-protocol, git-70991d4c) and
    # checked in. This job is the only thing that keeps the two from
    # drifting: it regenerates and fails on any diff, then runs the
    # differential harness, which compiles the generator's C driver and
    # renderer and requires the Rust to agree with them byte for byte.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Mako (the generator's only dependency)
        run: python -m pip install "mako==1.4.3"
      - name: Regenerate
        run: python scripts/venus-gen.py
      - name: Generated code is up to date
        run: git diff --exit-code -- crates/virtio-gpu/src/venus/protocol
      - name: The executor's ash bridge is up to date
        # scripts/venus-ash-gen.py reads the generated protocol and ash's
        # sources from the cargo registry.
        run: |
          cargo fetch
          python scripts/venus-ash-gen.py --check
      - name: The executor's generated translation and host calls are up to date
        # scripts/venus-exec-gen.py reads the same model as the protocol
        # (Mako, above), vk.xml, tools/venus-protocol/executor-classes.txt and
        # ash's sources (fetched above); it also refuses a classification
        # that disagrees with the executor's hand-written match arms.
        run: python scripts/venus-exec-gen.py --check
      - name: Differential check against the generated C
        run: python tools/venus-protocol/harness/run_differential.py --seeds 256

  license-audit:
    name: License audit (MVP-003)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  third-party-report:
    name: THIRD_PARTY_LICENSES + SBOM (MVP-006)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tooling (prebuilt binaries)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about,cargo-cyclonedx
      - name: Generate license report
        run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html
      - name: Generate SBOM
        run: cargo cyclonedx --format json
      - uses: actions/upload-artifact@v4
        with:
          name: compliance
          path: |
            THIRD_PARTY_LICENSES.html
            **/*.cdx.json
