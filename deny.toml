# cargo-deny configuration (backlog MVP-003).
# Hard rule: the host binary ships no copyleft code. GPL/AGPL/LGPL/MPL and
# friends are blocked outright; only permissive licenses are allowed.

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    # Mozilla's CA root store as shipped by `webpki-roots` (pulled in by the
    # rustls-based HTTP client in `debian-media`). CDLA-Permissive-2.0 is a
    # permissive *data* licence with no share-alike or copyleft obligation —
    # version 2.0 dropped the 1.0 reciprocity clause — so it satisfies the
    # "no copyleft in host code" rule (ADR-0001).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# Per-crate exceptions (EPIC 16, the egui/eframe GUI tree). Each is permissive
# and none carries a copyleft obligation on our code; they are scoped to the
# exact crate rather than allowed workspace-wide.
[[licenses.exceptions]]
# egui's bundled UI fonts (Ubuntu Light, Hack, Noto Emoji) as *data*. OFL-1.1
# and the Ubuntu Font Licence govern the font files: they forbid selling the
# fonts alone and require derivative *fonts* to keep the licence, but place no
# condition on the program that renders them, so the "no copyleft in host code"
# rule (ADR-0001) still holds. We ship the fonts unmodified.
name = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[[licenses.exceptions]]
# Windows clipboard backend behind `arboard` (used by egui-winit, and only
# compiled for windows targets). BSL-1.0 is OSI-approved, permissive and has no
# reciprocity clause; it requires the notice only in source distributions.
name = "clipboard-win"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
# Dependency of clipboard-win, same licence and same reasoning.
name = "error-code"
allow = ["BSL-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The internal `entangled` crates are path dependencies and are never published,
# so `{ path = "…" }` without a version requirement is intentional.
allow-wildcard-paths = true
# QEMU must never appear, in any form (ADR-0001).
deny = []

[advisories]
yanked = "deny"
ignore = [
    # Marvin Attack on the `rsa` crate (pulled in by rpgp in debian-media).
    # The timing side channel needs an attacker who can measure our *private*
    # RSA operations; debian-media only VERIFIES signatures with public keys —
    # no private-key RSA runs in this codebase. Revisit when rpgp bumps `rsa`.
    "RUSTSEC-2023-0071",
    # `ttf-parser` is unmaintained (not a vulnerability) and reaches us through
    # ab_glyph → epaint, i.e. the GUI text rasteriser. It only ever parses the
    # fonts egui bundles with itself — no guest- or network-supplied font data —
    # and no upgrade exists while egui uses ab_glyph. Revisit when egui moves to
    # a maintained parser (skrifa).
    "RUSTSEC-2026-0192",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
