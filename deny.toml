# cargo-deny configuration (backlog MVP-003).
# Hard rule: the host binary ships no copyleft code. GPL/AGPL/LGPL/MPL and
# friends are blocked outright; only permissive licenses are allowed.

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    # Mozilla's CA root store as shipped by `webpki-roots` (pulled in by the
    # rustls-based HTTP client in `debian-media`). CDLA-Permissive-2.0 is a
    # permissive *data* licence with no share-alike or copyleft obligation —
    # version 2.0 dropped the 1.0 reciprocity clause — so it satisfies the
    # "no copyleft in host code" rule (ADR-0001).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The internal `entangled` crates are path dependencies and are never published,
# so `{ path = "…" }` without a version requirement is intentional.
allow-wildcard-paths = true
# QEMU must never appear, in any form (ADR-0001).
deny = []

[advisories]
yanked = "deny"
# Fail only when a crate WE depend on directly is unmaintained; transitive
# unmaintained advisories (e.g. ttf-parser via winit's font stack) warn.
unmaintained = "workspace"
ignore = [
    # Marvin Attack on the `rsa` crate (pulled in by rpgp in debian-media).
    # The timing side channel needs an attacker who can measure our *private*
    # RSA operations; debian-media only VERIFIES signatures with public keys —
    # no private-key RSA runs in this codebase. Revisit when rpgp bumps `rsa`.
    "RUSTSEC-2023-0071",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
